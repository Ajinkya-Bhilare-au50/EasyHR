services:
  db:
    image: postgres:17-alpine
    container_name: easyhr-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: easyhr
      POSTGRES_PASSWORD: easyhr
      POSTGRES_DB: easyhr
    ports:
      - "5432:5432"
    volumes:
      - easyhr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyhr"]
      interval: 5s
      retries: 10

volumes:
  easyhr_pgdata:
